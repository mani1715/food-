name: Production Build & Hostinger Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://akublyjmyrcoeemuxugr.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_KREZO8qrQFap24pBhrQuuw_q8nlcOrs' }}
          VITE_APP_ENV: production

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/.htaccess || { echo "dist/.htaccess missing"; exit 1; }
          test -f dist/aishu-logo.png || { echo "dist/aishu-logo.png missing"; exit 1; }
          test -d dist/assets || { echo "dist/assets missing"; exit 1; }
          echo "All production build artifacts verified successfully."

      # Deploy Option 1: Automated Production Build Branch (for Hostinger Git Deployment)
      # When Hostinger's Git tool is configured with branch 'production-build',
      # Hostinger pulls this clean compiled static output directly into public_html.
      - name: Deploy to production-build Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: production-build
          keep_files: false
          force_orphan: true

      # Deploy Option 2: Automated Direct FTP Deployment to Hostinger public_html
      # Runs automatically if FTP_SERVER and FTP_USERNAME secrets are configured in GitHub.
      - name: Deploy to Hostinger via FTP (Optional Direct Sync)
        if: ${{ env.FTP_SERVER != '' && env.FTP_USERNAME != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
